# cbindgen settings for include/refimage.h. Regenerate with
#   REFIMAGE_BLESS=1 cargo test -p refimage-capi --test header
language = "C"
cpp_compat = true
include_guard = "REFIMAGE_H"
documentation = true
documentation_style = "doxy"
style = "type"
sort_by = "None"
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
header = """
/*
 * refimage.h -- C API for refimage (https://github.com/sunipkm/refimage).
 *
 * Link against librefimage_c (shared) or librefimage_c.a / refimage_c.lib (static).
 * A static link also needs the system libraries Rust's standard library uses:
 *   Linux:   -lgcc_s -lutil -lrt -lpthread -ldl -lm
 *   macOS:   -framework CoreFoundation -framework Security -lm
 *   Windows: kernel32 advapi32 ntdll userenv ws2_32 dbghelp bcrypt
 * (`cargo rustc -p refimage-capi --lib --crate-type staticlib -- --print
 * native-static-libs` prints the exact list for a toolchain.)
 *
 * GENERATED by cbindgen from crates/refimage-capi/src -- do not edit by hand.
 * SPDX-License-Identifier: MIT OR Apache-2.0
 */"""
after_includes = """
/** Library version this header was generated from. */
#define REF_VERSION_STRING "@VERSION@"
"""

[export]
prefix = ""
item_types = ["enums", "structs", "opaque", "typedefs", "constants", "functions"]

[enum]
prefix_with_name = false

[fn]
args = "horizontal"

[parse]
parse_deps = false

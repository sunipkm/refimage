[package]
name = "refimage-py"
description = "Python bindings (refimage._native) for refimage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
refimage.workspace = true
# The exchange format other extension modules use (the same code on both sides).
refimage-pyo3.workspace = true
bincode.workspace = true
bytemuck = "1.23"
# `Image()` timestamps default to `Utc::now()`, which needs the `clock` feature.
chrono = { workspace = true, features = ["clock"] }
numpy.workspace = true
pyo3 = { workspace = true, features = ["abi3-py312", "chrono"] }
serde_json.workspace = true

name: wasm

on:
  push:
    branches: [master, development]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-test-runner
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli
      - name: Build (all feature sets that support wasm)
        run: |
          cargo build --target wasm32-unknown-unknown --no-default-features
          cargo build --target wasm32-unknown-unknown
          cargo build --target wasm32-unknown-unknown --no-default-features --features image,grow
      - name: Test
        run: cargo test --target wasm32-unknown-unknown --no-default-features --lib --tests

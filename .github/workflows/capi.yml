name: capi

on:
  push:
    branches: [master, development]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Header freshness, zero-allocation runs, and tests/c/test_api.c compiled against
      # the static and shared libraries (plus ASan/LSan/UBSan on Linux).
      - name: Test
        run: cargo test -p refimage-capi
      - name: System libraries a static link needs
        run: cargo rustc -p refimage-capi --release --lib --crate-type staticlib -- --print native-static-libs 2>&1 | grep native-static-libs
      - name: Install, then build the example with pkg-config and CMake
        run: |
          prefix="$RUNNER_TEMP/prefix"
          crates/refimage-capi/install.sh "$prefix"
          cd "$RUNNER_TEMP"
          cc "$GITHUB_WORKSPACE/crates/refimage-capi/examples/c/stream.c" \
            $(PKG_CONFIG_PATH="$prefix/lib/pkgconfig" pkg-config --cflags --libs refimage) \
            -Wl,-rpath,"$prefix/lib" -o stream_pc
          ./stream_pc
          cmake -S "$GITHUB_WORKSPACE/crates/refimage-capi/examples/c" -B build \
            -DCMAKE_PREFIX_PATH="$prefix" -DCMAKE_BUILD_RPATH="$prefix/lib"
          cmake --build build
          ./build/stream
          ./build/stream_static

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p refimage-capi
      - name: Build the libraries
        run: |
          cargo build --release -p refimage-capi
          cargo rustc -p refimage-capi --release --lib --crate-type staticlib -- --print native-static-libs
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and run the C test against the DLL and the static library
        shell: cmd
        run: |
          set INC=/I crates\refimage-capi\include
          set SRC=crates\refimage-capi\tests\c\test_api.c
          cl /nologo /W3 /std:c11 /MD %INC% %SRC% target\release\refimage_c.dll.lib /Fe:capi_shared.exe || exit /b 1
          cl /nologo /W3 /std:c11 /MD %INC% %SRC% target\release\refimage_c.lib kernel32.lib advapi32.lib ntdll.lib userenv.lib ws2_32.lib dbghelp.lib bcrypt.lib /Fe:capi_static.exe || exit /b 1
          set PATH=%CD%\target\release;%PATH%
          capi_shared.exe %TEMP% || exit /b 1
          capi_static.exe %TEMP% || exit /b 1

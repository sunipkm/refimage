# Build, test and publish the `refimage` Python package.
#
# Release:  push a tag `py-v<version>` where <version> is the PEP 440 form of the
#           version in crates/refimage-py/Cargo.toml (1.0.0-pre6 -> py-v1.0.0rc6).
#           The wheels are uploaded to PyPI with trusted publishing (no API token).
# Dry run:  "Run workflow" from the Actions tab builds and tests everything, and
#           optionally uploads to TestPyPI.
#
# The extension is built against the stable ABI (abi3, Python >= 3.12), so one wheel
# per platform covers every supported Python version.
name: python-release

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:
    inputs:
      testpypi:
        description: Upload the build to TestPyPI
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  sdist:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: python
      - name: Read the package version
        id: version
        working-directory: python
        run: |
          file=$(basename dist/refimage-*.tar.gz)
          version=${file#refimage-}
          version=${version%.tar.gz}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${GITHUB_REF_NAME#py-v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $VERSION (expected py-v$VERSION)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: python/dist

  wheels:
    name: wheel ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: manylinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64-apple-darwin }
          - { name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin }
          - { name: windows-x64, runner: windows-latest, target: x64 }
          - { name: windows-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: --release --out dist
          working-directory: python
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform.name }}
          path: python/dist

  # Install the built wheels (not the source tree) and run the test suite, on the
  # oldest supported Python and the newest one.
  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Install the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # --no-index so a newer refimage on PyPI can't shadow the wheel built here.
          python -m pip install --only-binary=:all: --no-index --no-deps --find-links dist refimage
          python -m pip install numpy pytest scipy scikit-image astropy mypy
          python -m pip check
      # Run from outside python/ so `import refimage` resolves to the installed wheel
      # rather than the (uncompiled) source package.
      - name: Test
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest -q "$GITHUB_WORKSPACE/python/tests"
          python -m mypy.stubtest refimage._native \
            --allowlist "$GITHUB_WORKSPACE/python/stubtest-allowlist.txt"

  publish:
    name: publish to ${{ github.event_name == 'push' && 'PyPI' || 'TestPyPI' }}
    needs: [sdist, wheels, test]
    if: startsWith(github.ref, 'refs/tags/py-v') || (github.event_name == 'workflow_dispatch' && inputs.testpypi)
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
      url: ${{ github.event_name == 'push' && 'https://pypi.org/p/refimage' || 'https://test.pypi.org/p/refimage' }}
    permissions:
      id-token: write # trusted publishing
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: ${{ github.event_name == 'push' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          skip-existing: ${{ github.event_name != 'push' }}

  github-release:
    needs: [sdist, publish]
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.sdist.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *a*|*b*|*rc*|*dev*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "refimage (Python) $VERSION" \
            --generate-notes $prerelease

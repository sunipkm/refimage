[package]
name = "refimage"
version = "1.0.0-pre6"
edition = "2021"
resolver = "2"

license = "MIT OR Apache-2.0"
description = "Imaging library. Provides image storage using CoW-like structures to avoid re-allocation in image-aquisition scenarios. Supports rich metadata and serdes."
authors = ["Sunip K. Mukherjee <sunipkmukherjee@gmail.com>"]
readme = "README.MD"

# crates.io metadata
documentation = "https://docs.rs/refimage"
repository = "https://github.com/sunipkm/refimage"
homepage = "https://github.com/sunipkm/refimage"
categories = ["multimedia::images", "multimedia::encoding"]

include = [
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.MD",
    "/CHANGELOG.MD",
    "/src/",
    "/examples/",
    "/benches/",
]

[dependencies]
# Always required.
bytemuck = "1.23"
crc32fast = "1.5"
num-traits = "0.2.19"
paste = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

# Optional: pulled in by the feature named after each crate (see [features]).
# `chrono` is only used by the FITS date-stamp writer, and only needs `alloc`
# (for `DelayedFormat`'s `Display`) — not `std` or `clock`.
chrono = { version = "0.4", default-features = false, features = [
    "alloc",
], optional = true }
fitsio = { version = "0.21", optional = true }
image = { version = "0.25", optional = true, default-features = false }
rayon = { version = "1.10", optional = true }

[dev-dependencies]
bincode = "1.3"
serde-generate = "0.34"
serde_json = "1.0"
serde-reflection = "0.6"

# `rand` is only used by the benches, which never target wasm; keeping it off the
# wasm build avoids `getrandom`'s `wasm32-unknown-unknown` opt-in.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rand = "0.8"

# `tests/wasm.rs`:
#   cargo test --target wasm32-unknown-unknown --no-default-features --tests
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
# `refimage` always links `std` (it is built around `std::time::SystemTime` and
# `HashMap`); the features below only add optional integrations.
default = ["rayon"]
full = ["default", "fitsio", "image", "grow"]

# Parallel debayer / luminance / pixel-scale kernels in the pipeline.
rayon = ["dep:rayon"]
# `FitsWrite` / `create_fits`. Also pulls `chrono`, used only for the FITS
# date-stamp string.
fitsio = ["dep:fitsio", "dep:chrono"]
# `TryFrom` conversions to and from `image::DynamicImage`.
image = ["dep:image"]
# Let a compiled pipeline `Runner` reallocate its buffers when `run` is handed a
# frame whose shape differs from the one it was compiled for. Off by default so
# acquisition loops keep a hard no-allocation guarantee at steady state.
grow = []

[package.metadata.docs.rs]
# document all features
all-features = true
# defines the configuration attribute `docsrs`
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
path = "benches/cast_u8.rs"
name = "cast_u8"

[[example]]
name = "test_debayer"
path = "examples/test_debayer.rs"

[[example]]
name = "test_flow"
path = "examples/test_flow.rs"
required-features = ["full"]

[[example]]
name = "pipeline"
path = "examples/pipeline.rs"

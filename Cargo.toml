[workspace]
resolver = "3"
members = ["crates/refimage", "crates/refimage-py"]
default-members = ["crates/refimage"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunipkm/refimage"
authors = ["Sunip K. Mukherjee <sunipkmukherjee@gmail.com>"]

[workspace.dependencies]
bincode = "1.3"
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py312", "chrono"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[workspace]
resolver = "3"
members = [
    "crates/refimage",
    "crates/refimage-capi",
    "crates/refimage-py",
    "crates/refimage-pyo3",
    "crates/refimage-pyo3/tests/ext",
]
default-members = ["crates/refimage"]

[workspace.package]
# The release version comes from the git tag (vX.Y.Z / vX.Y.Z-preN): tools/version.py stamps
# it here, and into the internal dependencies below, when CI builds or publishes a release.
# The value committed here is the last release, the base of untagged development versions.
version = "1.0.0-pre6"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunipkm/refimage"
authors = ["Sunip K. Mukherjee <sunipkmukherjee@gmail.com>"]

[workspace.dependencies]
refimage = { path = "crates/refimage", version = "=1.0.0-pre6" }
refimage-pyo3 = { path = "crates/refimage-pyo3", version = "=1.0.0-pre6" }
bincode = "1.3"
chrono = { version = "0.4.31", default-features = false }
numpy = "0.29"
# No features here: the final extension module chooses them (`abi3-*`, `extension-module`),
# never a library that other extensions link (refimage-pyo3).
pyo3 = "0.29"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
